<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Proctoring Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; gap: 20px; }
    .sidebar { width: 300px; background: #1e293b; padding: 15px; border-radius: 8px; height: 85vh; overflow-y: auto; }
    .main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1e293b; border-radius: 8px; }
    ul { list-style: none; padding: 0; }
    li { background: #334155; margin-bottom: 8px; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    button { background: #3b82f6; border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button.stop { background: #ef4444; margin-top: 10px; }
    video { width: 90%; max-width: 640px; height: 480px; background: #000; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>Online Students</h3>
    <ul id="studentsList"></ul>
  </div>

  <div class="main">
    <video id="remoteVideo" autoplay playsinline></video>
    <button class="stop" onclick="stopStreaming()">Stop Camera Feed</button>
  </div>

  <script>
    const socket = io();
    let peerConnection = null;
    let currentStudentId = null;
    let currentTargetSocket = null;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    socket.emit('register', { role: 'admin', id: 'Admin' });

    socket.on('student-list', (list) => {
      const ul = document.getElementById('studentsList');
      ul.innerHTML = list.length === 0 ? '<p style="color:#94a3b8">No students online</p>' : '';
      list.forEach(id => {
        const li = document.createElement('li');
        li.textContent = id;
        const btn = document.createElement('button');
        btn.textContent = 'View';
        btn.onclick = () => viewStudent(id);
        li.appendChild(btn);
        ul.appendChild(li);
      });
    });

    function viewStudent(id) {
      if (peerConnection) stopStreaming();
      currentStudentId = id;
      socket.emit('request-stream', { studentId: id });
    }

    socket.on('offer', async ({ senderSocketId, sdp }) => {
      currentTargetSocket = senderSocketId;
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.ontrack = (e) => {
        document.getElementById('remoteVideo').srcObject = e.streams[0];
      };

      peerConnection.onicecandidate = (e) => {
        if (e.candidate) {
          socket.emit('ice-candidate', { targetSocketId: currentTargetSocket, candidate: e.candidate });
        }
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(sdp));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('answer', { targetSocketId: currentTargetSocket, sdp: peerConnection.localDescription });
    });

    socket.on('ice-candidate', async ({ candidate }) => {
      if (peerConnection && candidate) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });

    function stopStreaming() {
      if (currentStudentId) socket.emit('stop-stream', { studentId: currentStudentId });
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      document.getElementById('remoteVideo').srcObject = null;
    }
  </script>
</body>
</html>
