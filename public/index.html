<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Proctoring Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; gap: 20px; height: 90vh; }
    .sidebar { width: 300px; background: #1e293b; padding: 15px; border-radius: 8px; overflow-y: auto; }
    .main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1e293b; border-radius: 8px; position: relative; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #334155; margin-bottom: 8px; padding: 10px 14px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    button { background: #3b82f6; border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .controls { margin-top: 15px; display: flex; gap: 10px; }
    button.stop { background: #ef4444; display: none; }
    button.rotate { background: #64748b; display: none; }
    .video-box { width: 480px; height: 640px; max-height: 75vh; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
    img#monitorFeed { width: 100%; height: 100%; object-fit: contain; display: none; transition: transform 0.2s; }
    .badge { position: absolute; top: 10px; left: 10px; background: #ef4444; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: none; z-index: 10; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3 style="margin-top:0">Connected Students</h3>
    <ul id="studentsList"></ul>
  </div>

  <div class="main">
    <div class="video-box">
      <div id="badge" class="badge">● LIVE</div>
      <span id="placeholder" style="color: #64748b;">Select a student to view camera</span>
      <img id="monitorFeed" alt="Student Feed" />
    </div>
    <div class="controls">
      <button id="rotateBtn" class="rotate" onclick="rotateFeed()">Rotate 90°</button>
      <button id="stopBtn" class="stop" onclick="stopViewing()">Stop Feed</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentStudentId = null;
    let currentRotation = 0;

    socket.emit('register', { role: 'admin', id: 'Admin' });

    socket.on('student-list', (list) => {
      const ul = document.getElementById('studentsList');
      ul.innerHTML = list.length === 0 ? '<p style="color:#94a3b8">No students online</p>' : '';
      list.forEach(id => {
        const li = document.createElement('li');
        li.textContent = id + ' ';
        const btn = document.createElement('button');
        btn.textContent = id === currentStudentId ? 'Viewing' : 'View';
        btn.onclick = () => viewStudent(id);
        li.appendChild(btn);
        ul.appendChild(li);
      });
    });

    function viewStudent(id) {
      currentStudentId = id;
      document.getElementById('placeholder').textContent = 'Connecting to ' + id + '...';
      document.getElementById('monitorFeed').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';
      document.getElementById('rotateBtn').style.display = 'block';
      document.getElementById('badge').style.display = 'none';
      socket.emit('request-stream', { studentId: id });
    }

    socket.on('frame', ({ studentId, image }) => {
      if (studentId === currentStudentId) {
        const img = document.getElementById('monitorFeed');
        img.src = 'data:image/jpeg;base64,' + image;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('badge').style.display = 'block';
      }
    });

    function rotateFeed() {
      currentRotation = (currentRotation + 90) % 360;
      document.getElementById('monitorFeed').style.transform = `rotate(${currentRotation}deg)`;
    }

    function stopViewing() {
      if (currentStudentId) socket.emit('stop-stream', { studentId: currentStudentId });
      currentStudentId = null;
      document.getElementById('monitorFeed').style.display = 'none';
      document.getElementById('monitorFeed').src = '';
      document.getElementById('badge').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('rotateBtn').style.display = 'none';
      document.getElementById('placeholder').textContent = 'Select a student to view camera';
      document.getElementById('placeholder').style.display = 'block';
    }
  </script>
</body>
</html>
